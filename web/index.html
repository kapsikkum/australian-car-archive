<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Australian Automotive Archive — Makes, Models, Engines, Badges & Manuals</title>
  <style>
    :root {
      --bg: #0b0f17;
      --bg-card: #131b29;
      --bg-card-hover: #192436;
      --bg-panel: #0f1623;
      --border: #24324a;
      --text: #e6edf7;
      --text-muted: #93a4c1;
      --accent: #f59e0b;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.75rem;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }
    .brand-badge {
      background: var(--accent);
      color: #000;
      font-weight: 800;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }
    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }
    .stat-pill {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .stat-pill strong {
      color: var(--accent);
      font-weight: 700;
      margin-right: 0.25rem;
    }
    .nav-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.9rem;
      align-items: center;
    }
    .nav-btn {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.15s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .search-box {
      flex: 1;
      min-width: 260px;
      display: flex;
      gap: 0.5rem;
    }
    .search-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .layout {
      display: grid;
      grid-template-columns: 290px 1fr;
      min-height: calc(100vh - 115px);
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }
    aside {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
      max-height: calc(100vh - 115px);
      position: sticky;
      top: 115px;
    }
    .sidebar-filter {
      margin-bottom: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .sidebar-filter input, .sidebar-filter select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .make-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      margin-bottom: 0.2rem;
      border: 1px solid transparent;
    }
    .make-item:hover {
      background: var(--bg-card-hover);
    }
    .make-item.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .make-badges {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }
    .tag {
      font-size: 0.7rem;
      padding: 0.12rem 0.45rem;
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      color: var(--text-muted);
    }
    .tag.au {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      font-weight: 600;
    }
    .tag.deep {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      font-weight: 600;
    }
    main {
      padding: 1.5rem 2rem;
      overflow-x: hidden;
    }
    .section-header {
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.85rem;
    }
    .section-header h2 {
      font-size: 1.6rem;
      margin-bottom: 0.35rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.15rem;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card-img {
      width: 100%;
      height: 185px;
      object-fit: cover;
      background: #090d14;
      border-bottom: 1px solid var(--border);
    }
    .card-img-placeholder {
      width: 100%;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: var(--text-muted);
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .card-body {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-title {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .card-sub {
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .card-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 0.65rem;
    }
    .history-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      font-size: 0.92rem;
      color: #cbd5e1;
      white-space: pre-line;
    }
    .gallery-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .gallery-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .gallery-card img {
      width: 100%;
      height: 155px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    .gallery-caption {
      padding: 0.55rem 0.7rem;
      font-size: 0.76rem;
      color: var(--text-muted);
    }
    .manual-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .manual-item {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }
    .manual-btn {
      background: var(--accent-green);
      color: #000;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      white-space: nowrap;
    }
    .gen-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .gen-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.65rem;
      margin-bottom: 0.85rem;
    }
    .gen-title h3 {
      font-size: 1.2rem;
      color: var(--accent);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.6rem;
      margin-bottom: 1rem;
      font-size: 0.83rem;
    }
    th, td {
      text-align: left;
      padding: 0.55rem 0.65rem;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: rgba(255,255,255,0.04);
      color: var(--text-muted);
      font-weight: 600;
    }
    .sub-heading {
      font-size: 0.95rem;
      font-weight: 700;
      color: #93c5fd;
      margin-top: 0.9rem;
      margin-bottom: 0.3rem;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 2rem;
    }
    .modal.open { display: flex; }
    .modal img {
      max-width: 92vw;
      max-height: 85vh;
      border-radius: 8px;
      border: 2px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="brand-title" onclick="showFeaturedModels()">
        <span class="brand-badge">AUS ARCHIVE</span>
        <h1>Australian Automotive Database & Manual Repository</h1>
      </div>
      <div class="stats-bar" id="stats-bar">Loading archive metrics...</div>
    </div>
    <div class="nav-controls">
      <button class="nav-btn active" id="btn-featured" onclick="showFeaturedModels()">Deep-Dive Dossiers</button>
      <button class="nav-btn" id="btn-all-makes" onclick="showAllMakesGrid()">All 100 Makes</button>
      <button class="nav-btn" id="btn-engines" onclick="showEnginesExplorer()">Australian Engine Explorer</button>
      <button class="nav-btn" id="btn-random" onclick="showRandomCar('deep')" style="border-color: var(--accent); color: var(--accent);">🎲 Random Car</button>
      <div class="search-box">
        <input type="text" id="global-search" placeholder="Search makes, models, series (e.g. VF, BA, N80), engines (Barra, LS3, RB30, Hemi), badges (XU-1, XR6, GXL)..." oninput="debounceSearch(this.value)" />
      </div>
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="sidebar-filter">
        <input type="text" id="make-filter" placeholder="Filter makes..." oninput="renderSidebarMakes()" />
        <select id="make-scope" onchange="renderSidebarMakes()">
          <option value="all">All Makes in Australia (100)</option>
          <option value="local">Local Australian Manufacturers / Assemblers</option>
          <option value="current">Currently Sold in Australia</option>
          <option value="historic">Historic / Discontinued Makes</option>
        </select>
      </div>
      <div id="sidebar-makes"></div>
    </aside>

    <main id="main-content">
      <p>Loading Australian Automotive Archive...</p>
    </main>
  </div>

  <div class="modal" id="img-modal" onclick="this.classList.remove('open')">
    <img id="modal-img" src="" alt="Preview" />
  </div>

  <script>
    let allMakes = [];
    let currentMakeSlug = null;
    let searchTimer = null;

    async function init() {
      await Promise.all([loadStats(), loadMakes()]);
      showFeaturedModels();
    }

    async function loadStats() {
      const res = await fetch('/api/stats');
      const s = await res.json();
      document.getElementById('stats-bar').innerHTML = `
        <span class="stat-pill"><strong>${s.makes}</strong>Makes (${s.local_makes} AU Builders)</span>
        <span class="stat-pill"><strong>${s.models}</strong>Models (${s.local_models} Built in AU)</span>
        <span class="stat-pill"><strong>${s.generations}</strong>Series / Generations</span>
        <span class="stat-pill"><strong>${s.engines}</strong>Engines</span>
        <span class="stat-pill"><strong>${s.badges}</strong>Badges</span>
        <span class="stat-pill"><strong>${s.configurations}</strong>Configs</span>
        <span class="stat-pill"><strong>${s.pictures}</strong>Local Photos</span>
        <span class="stat-pill"><strong>${s.manuals}</strong>PDF Manuals</span>
      `;
    }

    async function loadMakes() {
      const res = await fetch('/api/makes');
      allMakes = await res.json();
      renderSidebarMakes();
    }

    function renderSidebarMakes() {
      const q = document.getElementById('make-filter').value.toLowerCase().trim();
      const scope = document.getElementById('make-scope').value;
      const container = document.getElementById('sidebar-makes');

      const filtered = allMakes.filter(m => {
        if (q && !m.name.toLowerCase().includes(q) && !m.make_slug.includes(q) && !(m.country_of_origin || '').toLowerCase().includes(q)) return false;
        if (scope === 'local' && !m.local_manufacturer) return false;
        if (scope === 'current' && !m.currently_sold_au) return false;
        if (scope === 'historic' && m.currently_sold_au) return false;
        return true;
      });

      container.innerHTML = filtered.map(m => `
        <div class="make-item ${currentMakeSlug === m.make_slug ? 'active' : ''}" onclick="loadMakeView('${m.make_slug}')">
          <span>${m.name}</span>
          <div class="make-badges">
            ${m.local_manufacturer ? '<span class="tag au" title="Manufactured or assembled in Australia">AU</span>' : ''}
            ${m.engine_count > 0 ? '<span class="tag deep" title="Has deep-dive specs">★</span>' : ''}
            <span class="tag">${m.model_count}</span>
          </div>
        </div>
      `).join('');
    }

    function setActiveNav(id) {
      ['btn-featured', 'btn-all-makes', 'btn-engines'].forEach(b => {
        const el = document.getElementById(b);
        if (el) el.classList.toggle('active', b === id);
      });
    }

    async function showFeaturedModels() {
      currentMakeSlug = null;
      renderSidebarMakes();
      setActiveNav('btn-featured');
      const main = document.getElementById('main-content');
      main.innerHTML = '<p>Loading deep-dive Australian vehicle dossiers...</p>';
      const res = await fetch('/api/models/featured');
      const models = await res.json();

      main.innerHTML = `
        <div class="section-header">
          <h2>Deep-Dive Australian Vehicle Dossiers (${models.length} Models)</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">
            Complete Australian specification records with series codes, engine specs, local badges/trims, factory configurations, local photos, and downloadable PDF technical manuals.
          </p>
        </div>
        <div class="grid">
          ${models.map(m => renderModelCard(m.make_slug, m, m.make_name)).join('')}
        </div>
      `;
    }

    function showAllMakesGrid() {
      currentMakeSlug = null;
      renderSidebarMakes();
      setActiveNav('btn-all-makes');
      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div class="section-header">
          <h2>All Car Makes Sold in Australia (${allMakes.length} Makes)</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Select any make to inspect its Australian history, assembly plants, and complete model & generation catalog.</p>
        </div>
        <div class="grid">
          ${allMakes.map(m => `
            <div class="card" onclick="loadMakeView('${m.make_slug}')">
              <div class="card-body">
                <div>
                  <div class="card-title">
                    <span>${m.name}</span>
                    ${m.local_manufacturer ? '<span class="tag au">AU Manufacturer / Assembler</span>' : ''}
                  </div>
                  <div class="card-sub">${m.country_of_origin || ''} • AU Years: ${m.years_active_au_start || '?'}-${m.years_active_au_end || '?'}</div>
                  <div class="card-desc">${m.overview || ''}</div>
                </div>
                <div class="card-footer">
                  <span class="tag"><strong>${m.model_count}</strong> Models</span>
                  <span class="tag"><strong>${m.generation_count}</strong> Series/Gens</span>
                  ${m.engine_count > 0 ? `<span class="tag deep">${m.engine_count} Engines</span>` : ''}
                  ${m.picture_count > 0 ? `<span class="tag au">${m.picture_count} Photos</span>` : ''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderModelCard(makeSlug, m, makeName = '') {
      const imgHtml = m.hero_image
        ? `<img class="card-img" src="/${m.hero_image}" alt="${m.name}" loading="lazy" />`
        : `<div class="card-img-placeholder">${makeName || makeSlug.toUpperCase()} ${m.name}</div>`;
      return `
        <div class="card" onclick="loadModelView('${makeSlug}', '${m.model_slug}')">
          ${imgHtml}
          <div class="card-body">
            <div>
              <div class="card-title">
                <span>${makeName ? makeName + ' ' : ''}${m.name}</span>
                ${m.locally_built ? '<span class="tag au">Built in AU</span>' : ''}
              </div>
              <div class="card-sub">${m.vehicle_type || 'Vehicle'} • ${m.years_sold_au_start || '?'}–${m.years_sold_au_end || '?'}</div>
              <div class="card-desc">${m.overview || ''}</div>
            </div>
            <div class="card-footer">
              <span class="tag"><strong>${m.generation_count || 0}</strong> Series</span>
              ${m.engine_count ? `<span class="tag deep"><strong>${m.engine_count}</strong> Engines</span>` : ''}
              ${m.badge_count ? `<span class="tag"><strong>${m.badge_count}</strong> Badges</span>` : ''}
              ${m.manual_count ? `<span class="tag au"><strong>${m.manual_count}</strong> PDF Manuals</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    async function loadMakeView(makeSlug) {
      currentMakeSlug = makeSlug;
      renderSidebarMakes();
      setActiveNav('');
      const main = document.getElementById('main-content');
      main.innerHTML = `<p>Loading ${makeSlug}...</p>`;
      const res = await fetch(`/api/makes/${makeSlug}`);
      const mk = await res.json();

      main.innerHTML = `
        <div class="section-header">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
            <h2>${mk.name} (${mk.country_of_origin || 'Global'})</h2>
            <div>
              ${mk.local_manufacturer ? '<span class="tag au" style="font-size:0.85rem; padding:0.3rem 0.7rem;">Manufactured / Assembled in Australia</span>' : ''}
              <span class="tag" style="font-size:0.85rem; padding:0.3rem 0.7rem;">AU Market: ${mk.years_active_au_start || '?'} – ${mk.years_active_au_end || '?'}</span>
            </div>
          </div>
          <p style="color: var(--text-muted); margin-top: 0.4rem;">${mk.overview || ''}</p>
        </div>
        ${mk.australian_history ? `
          <div class="history-box">
            <strong style="color: var(--accent); display:block; margin-bottom: 0.4rem;">Australian Market & Manufacturing History</strong>
            ${mk.australian_history}
          </div>
        ` : ''}
        <h3 style="margin-bottom: 1rem;">Models Sold in Australia (${(mk.models || []).length})</h3>
        <div class="grid">
          ${(mk.models || []).map(m => renderModelCard(mk.make_slug, m)).join('')}
        </div>
      `;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadModelView(makeSlug, modelSlug) {
      currentMakeSlug = makeSlug;
      renderSidebarMakes();
      setActiveNav('');
      const main = document.getElementById('main-content');
      main.innerHTML = `<p>Loading ${makeSlug}/${modelSlug}...</p>`;
      const res = await fetch(`/api/makes/${makeSlug}/models/${modelSlug}`);
      const mod = await res.json();

      const localPics = (mod.pictures || []).filter(p => p.local_path);
      const manuals = mod.manuals || [];

      main.innerHTML = `
        <div style="margin-bottom: 1rem; display: flex; gap: 0.6rem; flex-wrap: wrap;">
          <button class="nav-btn" onclick="loadMakeView('${makeSlug}')">← Back to ${makeSlug.toUpperCase()}</button>
          <button class="nav-btn" onclick="showRandomCar('deep')" style="border-color: var(--accent); color: var(--accent);">🎲 Another Random Deep-Dive Car</button>
          <button class="nav-btn" onclick="showRandomCar('all')">🎲 Random From All 441 Models</button>
        </div>
        <div class="section-header">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
            <h2>${makeSlug.toUpperCase()} — ${mod.name}</h2>
            <div>
              ${mod.locally_built ? '<span class="tag au" style="font-size:0.85rem; padding:0.3rem 0.7rem;">Built in Australia</span>' : ''}
              <span class="tag" style="font-size:0.85rem; padding:0.3rem 0.7rem;">${mod.vehicle_type || ''} (${mod.years_sold_au_start || '?'}–${mod.years_sold_au_end || '?'})</span>
            </div>
          </div>
          <p style="margin-top: 0.5rem; color: #cbd5e1;">${mod.overview || ''}</p>
          ${mod.australian_market_notes ? `<p style="margin-top: 0.5rem; color: var(--accent); font-size: 0.9rem;"><strong>Australian Market Notes:</strong> ${mod.australian_market_notes}</p>` : ''}
          ${mod.assembly_plants_au ? `<p style="margin-top: 0.35rem; color: var(--text-muted); font-size: 0.85rem;"><strong>Assembly Plants (AU):</strong> ${mod.assembly_plants_au}</p>` : ''}
        </div>

        ${manuals.length > 0 ? `
          <h3 style="margin-bottom: 0.75rem;">Manuals, Brochures & Technical Dossiers (${manuals.length})</h3>
          <div class="manual-list">
            ${manuals.map(man => `
              <div class="manual-item">
                <div>
                  <div style="font-weight: 700; font-size: 0.9rem;">${man.title}</div>
                  <div style="font-size: 0.76rem; color: var(--text-muted);">
                    Type: ${man.manual_type || 'Manual'} ${man.file_size_bytes ? `• ${(man.file_size_bytes / 1024).toFixed(1)} KB` : ''}
                  </div>
                </div>
                ${man.local_path
                  ? `<a class="manual-btn" href="/${man.local_path}" target="_blank">Open PDF</a>`
                  : `<a class="manual-btn" href="${man.source_url}" target="_blank" style="background:var(--accent-blue);color:#fff;">External Link</a>`
                }
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${localPics.length > 0 ? `
          <h3 style="margin-bottom: 0.75rem;">Local Photo Archive (${localPics.length} Photos on Disk)</h3>
          <div class="gallery-strip">
            ${localPics.map(p => `
              <div class="gallery-card">
                <img src="/${p.local_path}" alt="${p.caption || mod.name}" onclick="openModal('/${p.local_path}')" />
                <div class="gallery-caption">
                  <strong>${p.series_code || 'Hero'}</strong>: ${(p.caption || '').slice(0, 95)}
                  <div style="margin-top:0.2rem; font-size:0.7rem; opacity:0.75;">${p.license_or_credit || ''}</div>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <h3 style="margin-bottom: 0.85rem;">Australian Series / Generations (${(mod.generations || []).length})</h3>
        ${(mod.generations || []).map(g => `
          <div class="gen-block">
            <div class="gen-title">
              <h3>Series ${g.series_code} ${g.generation_name ? `— ${g.generation_name}` : ''}</h3>
              <div>
                <span class="tag">${g.years_start || '?'}–${g.years_end || '?'}</span>
                ${g.ancap_rating ? `<span class="tag au">ANCAP: ${g.ancap_rating}</span>` : ''}
                ${(g.body_styles || []).map(bs => `<span class="tag">${bs}</span>`).join(' ')}
              </div>
            </div>
            <p style="font-size: 0.9rem; color: #cbd5e1; margin-bottom: 0.75rem;">${g.summary || ''}</p>

            ${(g.engines || []).length > 0 ? `
              <div class="sub-heading">Engines Offered in Australia (${g.engines.length})</div>
              <table>
                <thead>
                  <tr>
                    <th>Engine Code</th>
                    <th>Name / Description</th>
                    <th>Displacement</th>
                    <th>Cyl / Config</th>
                    <th>Aspiration</th>
                    <th>Fuel</th>
                    <th>Power (kW)</th>
                    <th>Torque (Nm)</th>
                  </tr>
                </thead>
                <tbody>
                  ${g.engines.map(e => `
                    <tr>
                      <td><strong>${e.engine_code || '-'}</strong></td>
                      <td>${e.name || '-'} ${e.notes ? `<div style="font-size:0.75rem;color:var(--text-muted);">${e.notes}</div>` : ''}</td>
                      <td>${e.displacement_litres ? e.displacement_litres + 'L' : ''} ${e.displacement_cc ? `(${e.displacement_cc}cc)` : ''}</td>
                      <td>${e.cylinders || ''} ${e.configuration || ''}</td>
                      <td>${e.aspiration || ''}</td>
                      <td>${e.fuel_type || ''}</td>
                      <td style="color:var(--accent); font-weight:700;">${e.power_kw ? e.power_kw + ' kW' : '-'}</td>
                      <td style="color:#34d399; font-weight:700;">${e.torque_nm ? e.torque_nm + ' Nm' : '-'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : ''}

            ${(g.badges || []).length > 0 ? `
              <div class="sub-heading">Australian Badges & Trims (${g.badges.length})</div>
              <table>
                <thead>
                  <tr>
                    <th>Badge / Trim</th>
                    <th>Drivetrain</th>
                    <th>Transmissions</th>
                    <th>New Price (AUD)</th>
                    <th>Fuel (L/100km)</th>
                    <th>Weight (kg)</th>
                    <th>Standard Features / Notes</th>
                  </tr>
                </thead>
                <tbody>
                  ${g.badges.map(b => `
                    <tr>
                      <td><strong>${b.badge_name}</strong></td>
                      <td>${b.drivetrain || '-'}</td>
                      <td>${(b.transmissions || []).join(', ') || '-'}</td>
                      <td>${b.msrp_aud_min ? '$' + Number(b.msrp_aud_min).toLocaleString() : '-'} ${b.msrp_aud_max && b.msrp_aud_max !== b.msrp_aud_min ? '– $' + Number(b.msrp_aud_max).toLocaleString() : ''}</td>
                      <td>${b.fuel_consumption_l_100km || '-'}</td>
                      <td>${b.kerb_weight_kg || '-'}</td>
                      <td style="font-size:0.78rem; color:var(--text-muted);">
                        ${(b.standard_features || []).slice(0, 6).join(', ')}
                        ${b.notes ? `<div>${b.notes}</div>` : ''}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : ''}

            ${(g.configurations || []).length > 0 ? `
              <div class="sub-heading">Factory Configurations (${g.configurations.length})</div>
              <table>
                <thead>
                  <tr>
                    <th>Badge</th>
                    <th>Body Style</th>
                    <th>Engine Code</th>
                    <th>Transmission</th>
                    <th>Drivetrain</th>
                    <th>Output</th>
                  </tr>
                </thead>
                <tbody>
                  ${g.configurations.map(c => `
                    <tr>
                      <td><strong>${c.badge_name || '-'}</strong></td>
                      <td>${c.body_style || '-'}</td>
                      <td>${c.engine_code || '-'}</td>
                      <td>${c.transmission || '-'}</td>
                      <td>${c.drivetrain || '-'}</td>
                      <td>${c.power_kw ? c.power_kw + ' kW' : ''} ${c.torque_nm ? '/ ' + c.torque_nm + ' Nm' : ''}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : ''}
          </div>
        `).join('')}
      `;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function showEnginesExplorer(query = '') {
      currentMakeSlug = null;
      renderSidebarMakes();
      setActiveNav('btn-engines');
      const main = document.getElementById('main-content');
      const res = await fetch('/api/engines?q=' + encodeURIComponent(query));
      const engines = await res.json();

      main.innerHTML = `
        <div class="section-header">
          <h2>Australian Engine Explorer (Top ${engines.length} Matches by Power kW)</h2>
          <div style="margin-top: 0.65rem; max-width: 450px;">
            <input type="text" value="${query}" placeholder="Filter engines (e.g. Barra, LS3, RB30, Hemi, 1VD, V8, Turbo)..."
              style="width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--text); padding:0.5rem 0.8rem; border-radius:6px;"
              onkeydown="if(event.key==='Enter') showEnginesExplorer(this.value)" />
          </div>
        </div>
        <div class="gen-block">
          <table>
            <thead>
              <tr>
                <th>Vehicle</th>
                <th>Series</th>
                <th>Engine Code</th>
                <th>Description</th>
                <th>Specs</th>
                <th>Power</th>
                <th>Torque</th>
              </tr>
            </thead>
            <tbody>
              ${engines.map(e => `
                <tr style="cursor:pointer;" onclick="loadModelView('${e.make_slug}', '${e.model_slug}')">
                  <td><strong>${e.make_slug.toUpperCase()} ${e.model_slug.toUpperCase()}</strong></td>
                  <td><span class="tag">${e.series_code}</span></td>
                  <td><strong style="color:#93c5fd;">${e.engine_code || '-'}</strong></td>
                  <td>${e.name || '-'}</td>
                  <td>${e.displacement_litres || '?'}L ${e.configuration || ''}${e.cylinders || ''} (${e.aspiration || ''})</td>
                  <td style="color:var(--accent); font-weight:700;">${e.power_kw ? e.power_kw + ' kW' : '-'}</td>
                  <td style="color:#34d399; font-weight:700;">${e.torque_nm ? e.torque_nm + ' Nm' : '-'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function debounceSearch(val) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runGlobalSearch(val), 220);
    }

    async function runGlobalSearch(q) {
      if (!q || q.trim().length < 2) {
        showFeaturedModels();
        return;
      }
      const res = await fetch('/api/search?q=' + encodeURIComponent(q.trim()));
      const items = await res.json();
      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div class="section-header">
          <h2>Search Results for "${q}" (${items.length} matches)</h2>
        </div>
        <div class="grid">
          ${items.map(it => `
            <div class="card" onclick="loadModelView('${it.make_slug}', '${it.model_slug}')">
              <div class="card-body">
                <div>
                  <div class="card-title">
                    <span>${it.title}</span>
                    <span class="tag deep">${it.type.toUpperCase()}</span>
                  </div>
                  <div class="card-sub">${it.subtitle || ''}</div>
                  <div class="card-desc">${it.snippet || ''}</div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function showRandomCar(scope = 'deep') {
      const res = await fetch('/api/models/random?scope=' + encodeURIComponent(scope));
      const picked = await res.json();
      if (picked && picked.make_slug && picked.model_slug) {
        await loadModelView(picked.make_slug, picked.model_slug);
      }
    }

    function openModal(src) {
      document.getElementById('modal-img').src = src;
      document.getElementById('img-modal').classList.add('open');
    }

    init();
  </script>
</body>
</html>
